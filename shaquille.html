<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Shaquille Abdul Jabbar Fajarputra</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #2563EB;
            --accent-dark: #1D4ED8;
            --accent-glow: rgba(37, 99, 235, 0.35);
            --dark: #0a0a0a;
            --dark-2: #141414;
            --dark-3: #1a1a1a;
            --gray: #a3a3a3;
            --light: #f5f5f5;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-lines {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-line {
            position: absolute;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            opacity: 0.06;
            animation: lineDrift 10s linear infinite;
        }

        .bg-line:nth-child(1) { left: 15%; height: 50%; top: -50%; animation-duration: 8s; }
        .bg-line:nth-child(2) { left: 35%; height: 70%; top: -70%; animation-duration: 11s; animation-delay: 2s; }
        .bg-line:nth-child(3) { left: 60%; height: 40%; top: -40%; animation-duration: 7s; animation-delay: 1s; }
        .bg-line:nth-child(4) { left: 82%; height: 60%; top: -60%; animation-duration: 9s; animation-delay: 3s; }

        @keyframes lineDrift {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(100vh + 100%)); }
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(37,99,235,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37,99,235,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
        }

        .glow-a {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-glow), transparent 70%);
            border-radius: 50%;
            top: -180px;
            right: -120px;
            z-index: 0;
            animation: glowPulse 5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .glow-b {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(37,99,235,0.12), transparent 70%);
            border-radius: 50%;
            bottom: -120px;
            left: -80px;
            z-index: 0;
            animation: glowPulse 6s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.12); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 56px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .top-brand .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .top-label {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .hero {
            margin-bottom: 56px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(37,99,235,0.08);
            border: 1px solid rgba(37,99,235,0.18);
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 24px;
        }

        .hero-tag .tag-dot {
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .hero-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(34px, 7vw, 60px);
            font-weight: 700;
            line-height: 0.96;
            letter-spacing: -0.03em;
            color: var(--white);
            margin-bottom: 20px;
            min-height: 1.2em;
        }

        .hero-name .accent {
            color: var(--accent);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 0.9em;
            background: var(--accent);
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hero-desc {
            font-size: 15px;
            font-weight: 300;
            line-height: 1.75;
            color: var(--gray);
            max-width: 480px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 56px;
        }

        .stat-card {
            background: var(--dark-2);
            padding: 26px 18px;
            text-align: center;
            transition: background 0.3s ease;
        }

        .stat-card:hover {
            background: var(--dark-3);
        }

        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 5px;
        }

        .stat-value .unit {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gray);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 56px;
        }

        .detail-card {
            background: var(--dark-2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 26px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .detail-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--accent);
            transition: height 0.4s ease;
        }

        .detail-card:hover::before {
            height: 100%;
        }

        .detail-card:hover {
            border-color: rgba(37,99,235,0.18);
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.3);
        }

        .detail-icon {
            width: 42px;
            height: 42px;
            background: rgba(37,99,235,0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            color: var(--accent);
        }

        .detail-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 7px;
        }

        .detail-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--white);
            line-height: 1.4;
        }

        .detail-card.full {
            grid-column: 1 / -1;
        }

        .detail-card.full .detail-value {
            font-size: 20px;
        }

        .skills-section {
            margin-bottom: 56px;
        }

        .skills-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 22px;
        }

        .skill-item {
            margin-bottom: 18px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .skill-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--light);
        }

        .skill-pct {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }

        .skill-track {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
            overflow: hidden;
        }

        .skill-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #60A5FA);
            border-radius: 100px;
            width: 0%;
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .quote-section {
            text-align: center;
            padding: 48px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 36px;
        }

        .quote-mark {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 56px;
            color: var(--accent);
            line-height: 1;
            opacity: 0.4;
            margin-bottom: 8px;
        }

        .quote-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(17px, 3vw, 22px);
            font-weight: 500;
            color: var(--light);
            line-height: 1.55;
            max-width: 560px;
            margin: 0 auto;
            font-style: italic;
        }

        .quote-author {
            margin-top: 14px;
            font-size: 12px;
            color: var(--gray);
            font-weight: 500;
        }

        .footer {
            text-align: center;
            padding: 28px 0;
        }

        .footer-text {
            font-size: 11px;
            color: rgba(255,255,255,0.18);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .footer-text .heart {
            color: var(--accent);
            display: inline-block;
            animation: heartBeat 1.4s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark-3);
            border: 1px solid rgba(37,99,235,0.25);
            color: var(--light);
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast .toast-icon {
            color: var(--accent);
        }

        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            background: var(--accent);
        }

        @media (max-width: 768px) {
            .container { padding: 24px 16px 40px; }
            .details-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr; gap: 1px; }
            .hero { margin-bottom: 40px; }
            .stats-row, .details-grid, .skills-section { margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <div class="bg-lines">
        <div class="bg-line"></div>
        <div class="bg-line"></div>
        <div class="bg-line"></div>
        <div class="bg-line"></div>
    </div>
    <div class="grid-bg"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div id="particles"></div>

    <div class="toast" id="toast">
        <i data-lucide="sparkles" class="toast-icon" style="width:16px;height:16px;"></i>
        <span id="toastMsg"></span>
    </div>

    <div class="container">

        <div class="top-bar reveal">
            <div class="top-brand">
                <span class="brand-dot"></span>
                Biodata
            </div>
            <div class="top-label">Personal Info</div>
        </div>

        <div class="hero reveal">
            <div class="hero-tag">
                <span class="tag-dot"></span>
                Profil Siswa
            </div>
            <h1 class="hero-name" id="heroName"></h1>
            <p class="hero-desc">
             Haiiii
            </p>
        </div>

        <div class="stats-row reveal">
            <div class="stat-card">
                <div class="stat-value" id="stat1">0</div>
                <div class="stat-label">Tanggal Lahir</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat2">0</div>
                <div class="stat-label">Tahun</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat3">0</div>
                <div class="stat-label">Tahun Lahir</div>
            </div>
        </div>

        <div class="details-grid">
            <div class="detail-card reveal">
                <div class="detail-icon">
                    <i data-lucide="user" style="width:18px;height:18px;"></i>
                </div>
                <div class="detail-label">Nama Lengkap</div>
                <div class="detail-value">Shaquille Abdul Jabbar Fajarputra</div>
            </div>
            <div class="detail-card reveal">
                <div class="detail-icon">
                    <i data-lucide="graduation-cap" style="width:18px;height:18px;"></i>
                </div>
                <div class="detail-label">Kelas</div>
                <div class="detail-value">9B</div>
            </div>
            <div class="detail-card reveal">
                <div class="detail-icon">
                    <i data-lucide="tv" style="width:18px;height:18px;"></i>
                </div>
                <div class="detail-label">Hobby</div>
                <div class="detail-value">Menonton F1</div>
            </div>
            <div class="detail-card reveal" onclick="showToast('Status aktif terdeteksi ✦')" style="cursor:pointer;">
                <div class="detail-icon">
                    <i data-lucide="signal" style="width:18px;height:18px;"></i>
                </div>
                <div class="detail-label">Status</div>
                <div class="detail-value" style="display:flex;align-items:center;gap:8px;">
                    <span style="width:7px;height:7px;background:#22c55e;border-radius:50%;display:inline-block;animation:dotPulse 1.5s ease-in-out infinite;"></span>
                    Aktif
                </div>
            </div>
            <div class="detail-card full reveal">
                <div class="detail-icon">
                    <i data-lucide="star" style="width:18px;height:18px;"></i>
                </div>
                <div class="detail-label">Impian</div>
                <div class="detail-value">Menjadi Pembalap F1 / F2</div>
            </div>
        </div>

    
            

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            typeWriter();
            animateCounters();
            initScrollReveal();
            animateSkillBars();
            initParticles();
        });

        function typeWriter() {
            const name = "Shaquille Abdul\nJabbar Fajarputra";
            const el = document.getElementById('heroName');
            let i = 0;

            function type() {
                if (i < name.length) {
                    if (name[i] === '\n') {
                        el.innerHTML += '<br>';
                    } else if ('AJF'.includes(name[i])) {
                        el.innerHTML += `<span class="accent">${name[i]}</span>`;
                    } else {
                        el.innerHTML += name[i];
                    }
                    i++;
                    setTimeout(type, 45);
                } else {
                    el.innerHTML += '<span class="cursor"></span>';
                }
            }

            setTimeout(type, 400);
        }

        function animateCounters() {
            countUp('stat1', 0, 3, 2000, '');
            countUp('stat2', 0, 14, 2000, '');
            countUp('stat3', 0, 2012, 2000, '');
        }

        function countUp(id, start, end, duration, unit) {
            const el = document.getElementById(id);
            const t0 = performance.now();

            function update(now) {
                const p = Math.min((now - t0) / duration, 1);
                const eased = 1 - Math.pow(1 - p, 3);
                const val = Math.round(start + (end - start) * eased);
                el.innerHTML = `${val}<span class="unit"> ${unit}</span>`;
                if (p < 1) requestAnimationFrame(update);
            }

            setTimeout(() => requestAnimationFrame(update), 500);
        }

        function initScrollReveal() {
            const items = document.querySelectorAll('.reveal');
            const obs = new IntersectionObserver((entries) => {
                entries.forEach((e, i) => {
                    if (e.isIntersecting) {
                        setTimeout(() => e.target.classList.add('visible'), i * 80);
                        obs.unobserve(e.target);
                    }
                });
            }, { threshold: 0.1 });
            items.forEach(el => obs.observe(el));
        }

        function animateSkillBars() {
            const fills = document.querySelectorAll('.skill-fill');
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        setTimeout(() => {
                            e.target.style.width = e.target.dataset.width + '%';
                        }, 200);
                        obs.unobserve(e.target);
                    }
                });
            }, { threshold: 0.3 });
            fills.forEach(f => obs.observe(f));
        }

        function initParticles() {
            const box = document.getElementById('particles');
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.width = (Math.random() * 2.5 + 1) + 'px';
                p.style.height = p.style.width;
                box.appendChild(p);
                driftParticle(p);
            }
        }

        function driftParticle(p) {
            const dur = Math.random() * 9000 + 5000;
            const sx = Math.random() * window.innerWidth;
            const sy = window.innerHeight + 10;
            const ex = sx + (Math.random() - 0.5) * 180;
            const ey = -10;

            p.style.left = sx + 'px';
            p.style.top = sy + 'px';

            const a = p.animate([
                { left: sx + 'px', top: sy + 'px', opacity: 0 },
                { opacity: 0.5, offset: 0.15 },
                { opacity: 0.3, offset: 0.85 },
                { left: ex + 'px', top: ey + 'px', opacity: 0 }
            ], { duration: dur, easing: 'linear' });

            a.onfinish = () => driftParticle(p);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2800);
        }
    </script>

</body>
</html>
