<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Luar Angkasa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #030511;
            color: #e0f7fc;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* LIVE BACKGROUND: STARS & WAR ZONE */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(ellipse at bottom, #101c2e 0%, #030511 100%);
        }

        /* SCANLINE HUD EFFECT OVERLAY */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        /* SPACESHIPS ANIMATION */
        .spaceship {
            position: fixed;
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8));
        }

        /* Ship 1: Fast interceptor (Bottom to Top) */
        .ship-1 {
            width: 42px;
            left: 18%;
            bottom: -100px;
            animation: flyUp 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            animation-delay: 0.5s;
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.9));
        }

        /* Ship 2: Heavy Cruiser (Bottom to Top) */
        .ship-2 {
            width: 62px;
            left: 78%;
            bottom: -150px;
            animation: flyUpDiagonalRight 6.5s linear infinite;
            animation-delay: 1.5s;
            filter: drop-shadow(0 0 14px rgba(255, 0, 85, 0.9));
        }

        /* Ship 3: Stealth Fighter (Bottom to Top) */
        .ship-3 {
            width: 32px;
            left: 48%;
            bottom: -100px;
            animation: flyUpDiagonalLeft 5.2s linear infinite;
            animation-delay: 3s;
            filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.9));
        }

        /* KEYFRAMES FOR SPACESHIPS */
        @keyframes flyUp {
            0% { bottom: -100px; transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(25px) rotate(3deg); }
            100% { bottom: 108vh; transform: translateX(-15px) rotate(-2deg); }
        }

        @keyframes flyUpDiagonalRight {
            0% { bottom: -150px; transform: translateX(0) rotate(6deg); }
            100% { bottom: 108vh; transform: translateX(70px) rotate(6deg); }
        }

        @keyframes flyUpDiagonalLeft {
            0% { bottom: -100px; transform: translateX(0) rotate(-7deg); }
            100% { bottom: 108vh; transform: translateX(-90px) rotate(-7deg); }
        }

        /* BIODATA CARD CONTAINER */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: rgba(8, 14, 28, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.18),
                        inset 0 0 20px rgba(0, 243, 255, 0.08);
            animation: cardEntrance 1.2s ease-out forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* HUD CORNER ACCENTS */
        .container::before, .container::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00f3ff;
            pointer-events: none;
        }

        .container::before {
            top: 12px;
            left: 12px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 8px;
        }

        .container::after {
            bottom: 12px;
            right: 12px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 8px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        /* PULSING NEON RING */
        .avatar-container::before {
            content: "";
            position: absolute;
            top: -6px; left: -6px;
            right: -6px; bottom: -6px;
            border-radius: 50%;
            border: 2px stroke #00f3ff;
            background: conic-gradient(from 0deg, transparent, #00f3ff, transparent);
            animation: rotateGlow 4s linear infinite;
            z-index: -1;
            opacity: 0.8;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
            background-color: #090a0f;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.8), 0 0 25px rgba(0, 243, 255, 0.4);
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #00f3ff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        /* TABLE & INFO STYLING */
        .bio-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 15px;
        }

        .bio-table tr {
            background: rgba(0, 243, 255, 0.02);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .bio-table tr:hover {
            background: rgba(0, 243, 255, 0.1);
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .bio-table td {
            padding: 14px 16px;
            font-size: 1.1rem;
            border-top: 1px solid rgba(0, 243, 255, 0.1);
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .bio-table td:first-child {
            border-left: 1px solid rgba(0, 243, 255, 0.1);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        .bio-table td:last-child {
            border-right: 1px solid rgba(0, 243, 255, 0.1);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .bio-table td.label {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #00f3ff;
            width: 38%;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .bio-table td.value {
            color: #e0f7fc;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* HOBBY TAGS */
        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid #00f3ff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: #00f3ff;
            color: #030511;
            box-shadow: 0 0 15px #00f3ff;
            transform: translateY(-2px);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .subtitle {
                font-size: 0.85rem;
                letter-spacing: 2px;
            }
            .bio-table td {
                display: block;
                width: 100% !important;
                padding: 8px 12px;
            }
            .bio-table td.label {
                padding-bottom: 2px;
            }
            .bio-table td.value {
                padding-top: 2px;
            }
            .bio-table tr {
                display: block;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <canvas id="space-bg"></canvas>

    <svg class="spaceship ship-1" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="45,85 50,100 55,85" fill="#00f3ff" opacity="0.9"/>
        <path d="M50 5 L65 50 L85 65 L60 75 L50 90 L40 75 L15 65 L35 50 Z" fill="#0b1726" stroke="#00f3ff" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M50 15 L72 60 M50 15 L28 60" stroke="#00f3ff" stroke-width="1.5"/>
        <polygon points="50,20 57,40 50,48 43,40" fill="#00f3ff" opacity="0.8"/>
    </svg>

    <svg class="spaceship ship-2" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="35,82 40,98 45,82" fill="#ff0055"/>
        <polygon points="55,82 60,98 65,82" fill="#ff0055"/>
        <path d="M50 5 L62 30 L95 70 L70 75 L65 85 L50 80 L35 85 L30 75 L5 70 L38 30 Z" fill="#200613" stroke="#ff0055" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M50 5 L50 80 M38 30 L62 30 M20 60 L80 60" stroke="#ff0055" stroke-width="1.5" opacity="0.8"/>
        <polygon points="50,15 56,35 50,45 44,35" fill="#ff0055" opacity="0.8"/>
    </svg>

    <svg class="spaceship ship-3" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="48,82 50,96 52,82" fill="#00ff66"/>
        <path d="M50 5 L90 80 L50 68 L10 80 Z" fill="#051c0e" stroke="#00ff66" stroke-width="2.5" stroke-linejoin="round"/>
        <polygon points="50,25 58,50 50,58 42,50" fill="#00ff66" opacity="0.8"/>
        <line x1="50" y1="5" x2="50" y2="68" stroke="#00ff66" stroke-width="1.5"/>
    </svg>

    <div class="container">
        <div class="profile-header">
            <div class="avatar-container">
                <img src="https://via.placeholder.com/150/090a0f/00f3ff?text=PILOT" alt="Foto Profil" class="avatar">
            </div>
            <h1>Nama Lengkap</h1>
            <div class="subtitle">Raisya naufal Alif </div>
        </div>

        <table class="bio-table">
            <tr>
                <td class="label">Nama Panggilan</td>
                <td class="value">Alip</td>
            </tr>
            <tr>
                <td class="label">Tempat, Tgl Lahir</td>
                <td class="value">Bandung, 4 maret 2012</td>
            </tr>
            <tr>
                <td class="label">Pekerjaan / Status</td>
                <td class="value">Pelajar </td>
            </tr>
            <tr>
                <td class="label">Alamat / Base</td>
                <td class="value">Sukaasih Atas III RT.03 RW.06</td>
            </tr>
            <tr>
                <td class="label">Keahlian</td>
                <td class="value">Gamers</td>
            </tr>
            <tr>
                <td class="label">Hobi</td>
                <td class="value">
                    <div class="tags">
                        <span class="tag">Memelihara ikan</span>
                        <span class="tag">berenang</span>
                        <span class="tag">sepak bola</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">Motto Hidup</td>
                <td class="value">"Yang lalu biarlah berlalu."</td>
            </tr>
        </table>
    </div>

    <script>
        const canvas = document.getElementById('space-bg');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let shootingStars = [];
        const numStars = 250;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Color palette for space stars
        const starColors = ['#ffffff', '#e0f7fc', '#00f3ff', '#a5f3fc', '#d8b4fe'];

        // Create Star objects
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8 + 0.3,
                alpha: Math.random(),
                color: starColors[Math.floor(Math.random() * starColors.length)],
                speed: (Math.random() * 0.025 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
                glow: Math.random() > 0.65
            });
        }

        // Shooting Star class
        function createShootingStar() {
            if (Math.random() < 0.015 && shootingStars.length < 3) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.5),
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 10 + 6,
                    angle: Math.PI / 4,
                    alpha: 1
                });
            }
        }

        // Animation loop for twinkling stars & shooting stars
        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render twinkling stars
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha >= 1) {
                    star.alpha = 1;
                    star.speed = -Math.abs(star.speed);
                } else if (star.alpha <= 0.05) {
                    star.alpha = 0.05;
                    star.speed = Math.abs(star.speed);
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.alpha;

                if (star.glow) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = star.color;
                }

                ctx.fill();
                ctx.restore();
            });

            // Render shooting stars (Komet)
            createShootingStar();
            shootingStars.forEach((s, index) => {
                ctx.save();
                ctx.beginPath();
                const endX = s.x - Math.cos(s.angle) * s.length;
                const endY = s.y - Math.sin(s.angle) * s.length;

                const gradient = ctx.createLinearGradient(s.x, s.y, endX, endY);
                gradient.addColorStop(0, `rgba(0, 243, 255, ${s.alpha})`);
                gradient.addColorStop(1, 'rgba(0, 243, 255, 0)');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.restore();

                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.alpha -= 0.012;

                if (s.alpha <= 0 || s.x > canvas.width || s.y > canvas.height) {
                    shootingStars.splice(index, 1);
                }
            });

            requestAnimationFrame(animateStars);
        }

        animateStars();
    </script>
</body>
</html>
