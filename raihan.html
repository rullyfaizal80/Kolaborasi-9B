<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Lobby Profile - Raihan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030509;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1500px;
    }

    /* --- DEKORASI BACKGROUND MAKSIMAL --- */
    
    .bg-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 157, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 157, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: rotateX(65deg) translateZ(-100px);
      bottom: -60%;
      animation: gridMove 10s linear infinite;
      z-index: 1;
    }

    @keyframes gridMove {
      0% { transform: rotateX(65deg) translateZ(-100px) translateY(0); }
      100% { transform: rotateX(65deg) translateZ(-100px) translateY(50px); }
    }

    /* Partikel Digital */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(0, 255, 157, 0.5);
      border-radius: 50%;
      animation: particleFall linear infinite;
    }

    @keyframes particleFall {
      0% { transform: translateY(-10px) scale(0); opacity: 0; }
      10% { opacity: 1; scale: 1; }
      90% { opacity: 1; scale: 1; }
      100% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    }

    .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; animation-duration: 5s; animation-delay: 0s; }
    .particle:nth-child(2) { width: 6px; height: 6px; left: 25%; animation-duration: 7s; animation-delay: 1s; }
    .particle:nth-child(3) { width: 3px; height: 3px; left: 40%; animation-duration: 4s; animation-delay: 2s; }
    .particle:nth-child(4) { width: 5px; height: 5px; left: 60%; animation-duration: 6s; animation-delay: 1.5s; }
    .particle:nth-child(5) { width: 4px; height: 4px; left: 75%; animation-duration: 5s; animation-delay: 3s; }
    .particle:nth-child(6) { width: 7px; height: 7px; left: 90%; animation-duration: 8s; animation-delay: 0.5s; }

    /* --- ANIMASI PINTU LOBBY --- */
    .gate-left, .gate-right {
      position: fixed;
      top: 0;
      width: 50vw;
      height: 100vh;
      background: #080a12;
      z-index: 100;
      display: flex;
      align-items: center;
      border-color: #00ff9d;
      box-shadow: 0 0 30px rgba(0, 255, 157, 0.5);
      animation: openGate 1.5s cubic-bezier(0.77, 0, 0.175, 1) 1s forwards;
    }

    .gate-left { left: 0; border-right: 3px solid #00ff9d; justify-content: flex-end; animation-name: openGateLeft; }
    .gate-right { right: 0; border-left: 3px solid #00ff9d; justify-content: flex-start; }

    @keyframes openGateLeft { to { transform: translateX(-100%); visibility: hidden; } }
    @keyframes openGate { to { transform: translateX(100%); visibility: hidden; } }

    .loading-text {
      position: fixed;
      z-index: 101;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #00ff9d;
      text-shadow: 0 0 20px #00ff9d;
      animation: fadeOut 0.8s ease forwards 0.8s;
      text-transform: uppercase;
    }

    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    /* --- KARTU BIO DATA --- */
    .bio-card {
      position: relative;
      z-index: 10;
      background: rgba(8, 10, 18, 0.9);
      border: 1px solid rgba(0, 255, 157, 0.2);
      backdrop-filter: blur(15px);
      padding: 35px 30px;
      width: 380px;
      border-radius: 20px;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 255, 157, 0.1);
      
      opacity: 0;
      transform: scale(0.7) translateY(50px) rotateX(-20deg);
      animation: spawnCard 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.2s forwards;
      
      transition: transform 0.4s, box-shadow 0.4s;
    }

    .bio-card:hover {
      transform: scale(1.05) translateY(-10px) rotateX(5deg) rotateY(2deg);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 1), 0 0 40px rgba(0, 255, 157, 0.4);
    }

    @keyframes spawnCard {
      to { opacity: 1; transform: scale(1) translateY(0) rotateX(0deg); }
    }

    /* Animasi Cahaya Neon Border */
    .bio-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent, 
        transparent, 
        transparent, 
        #00ff9d, 
        transparent
      );
      animation: borderFlow 4s linear infinite;
      z-index: -1;
    }

    .bio-card::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #080a12;
      border-radius: 17px;
      z-index: -1;
    }

    @keyframes borderFlow {
      100% { transform: rotate(360deg); }
    }

    /* --- DEKORASI LOGO XBOX --- */
    .xbox-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px auto;
      filter: drop-shadow(0 0 12px #00ff9d);
      animation: xboxGlow 2s ease-in-out infinite alternate;
    }

    @keyframes xboxGlow {
      from { filter: drop-shadow(0 0 8px #00ff9d); transform: scale(1); }
      to { filter: drop-shadow(0 0 20px #00ff9d); transform: scale(1.08); }
    }

    /* --- ELEMEN HUD & TEKS --- */
    .hud-line {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(to right, transparent, #00ff9d, transparent);
      box-shadow: 0 0 10px #00ff9d;
      animation: hudMove 3s ease-in-out infinite;
    }
    .hud-top { top: 15px; }
    .hud-bottom { bottom: 15px; animation-delay: 1.5s; }

    @keyframes hudMove {
      0%, 100% { transform: scaleX(1); opacity: 0.5; }
      50% { transform: scaleX(1.1); opacity: 1; }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 157, 0.1);
      border: 1px solid #00ff9d;
      color: #00ff9d;
      padding: 6px 18px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 30px;
      margin-bottom: 15px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #00ff9d;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff9d;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(0, 255, 157, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); }
    }

    .bio-card h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(0, 255, 157, 0.6), 0 0 30px rgba(0, 255, 157, 0.3);
      text-transform: uppercase;
    }

    .info-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.3s, border 0.3s;
    }

    .info-box:hover {
      background: rgba(0, 255, 157, 0.05);
      border-color: rgba(0, 255, 157, 0.3);
    }

    .info-label {
      font-size: 0.85rem;
      color: #a1a1aa;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Warna Teks Ditingkatkan ke Hijau Neon Terang agar Mudah Dibaca */
    .info-val {
      font-size: 1rem;
      font-weight: 700;
      color: #00ff9d;
      text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
    }

  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="gate-left"></div>
  <div class="gate-right"></div>
  <div class="loading-text">Initializing Lobby...</div>

  <div class="bio-card">
    
    <div class="hud-line hud-top"></div>
    <div class="hud-line hud-bottom"></div>

    <div class="xbox-logo">
      <svg viewBox="0 0 24 24" fill="#00ff9d" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.93 14.88c-.68.53-1.87 1.07-3.93 1.07-2.06 0-3.25-.54-3.93-1.07-.44-.34-.41-.7.09-1.08 1.48-1.12 3.01-2.22 3.84-2.83.21-.15.43-.22.66-.22s.45.07.66.22c.83.61 2.36 1.71 3.84 2.83.5.38.53.74.09 1.08zm2.66-9.15c.57.81.91 1.79.91 2.85 0 1.25-.48 2.39-1.27 3.25-1.16-.92-2.38-1.82-3.32-2.52.27-.37.52-.77.74-1.21 1.22-.92 2.37-1.8 2.94-2.37zm-13.18 0c.57.57 1.72 1.45 2.94 2.37.22.44.47.84.74 1.21-.94.7-2.16 1.6-3.32 2.52C4.48 12.97 4 11.83 4 10.58c0-1.06.34-2.04.91-2.85z"/>
      </svg>
    </div>

    <div class="status-badge">
      <span class="dot"></span> Xbox Player
    </div>

    <h1>RAIHAN</h1>

    <div class="info-container">
      <div class="info-box">
        <span class="info-label">Identification</span>
        <span class="info-val">Raihan_2011</span>
      </div>

      <div class="info-box">
        <span class="info-label">🗓️ Birth Date</span>
        <span class="info-val">10 April 2011</span>
      </div>

      <div class="info-box">
        <span class="info-label">🎮 Access Level</span>
        <span class="info-val">Elite VIP</span>
      </div>
    </div>
  </div>

</body>
</html>
