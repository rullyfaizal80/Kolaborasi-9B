<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Sederhana + CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h1 {
            color: #333333;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4caf50;
            padding-bottom: 10px;
        }
        .info {
            margin-bottom: 15px;
            font-size: 16px;
            color: #555555;
        }
        strong {
            color: #333333;
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Biodata Diri</h1>
        <div class="info"><strong>Nama:</strong> Rully Faizal</div>
        <div class="info"><strong>Tanggal Lahir:</strong> 07 April 1980</div>
        <div class="info"><strong>Alamat:</strong> KBA Blok F-3</div>
        <div class="info"><strong>Hobi:</strong> Coding</div>
    </div>

</body>
</html>
